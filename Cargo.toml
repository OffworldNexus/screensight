# Workspace root. The Raspberry Pi device daemon lives in `device/`; the Home
# Assistant Python integration lives in `custom_components/screensight/`.
#
# `[patch]` and `[profile]` are honoured only at the workspace root, so the
# vendored `xattr` / `blade-graphics` fixes and the release profile stay here.
[workspace]
resolver = "2"
members = ["device"]

# Three patched crates, pinned by rev so builds stay reproducible.
#   * `xattr` 0.2.3 and `blade-graphics` 0.7.1 are commits on a `screensight`
#     branch of a real fork of their upstream (OffworldNexus/xattr,
#     OffworldNexus/blade), so the patches live in the fork network and can be
#     offered upstream. `xattr` has no `ENOATTR` on Linux/aarch64;
#     `blade-graphics` needs a V3DV-compatible composite-alpha/present-mode path.
#   * `gpui` 0.2.2 has no standalone upstream: it is `crates/gpui` in the zed
#     monorepo, which uses workspace/path deps (so building from a zed fork would
#     pull a large subgraph and clone ~520 MB). It is therefore a standalone
#     patched mirror of the published crate, carrying the Screensight GPU CRT
#     screen-transition shader.
[patch.crates-io]
xattr = { git = "https://github.com/OffworldNexus/xattr", rev = "ff3eae4d59b70ecd25fd312a03b439575caa9d4d" }
blade-graphics = { git = "https://github.com/OffworldNexus/blade", rev = "2fa58fb0c5faff7653a5910ff05e13125ebb8692" }
gpui = { git = "https://github.com/OffworldNexus/gpui", rev = "cf52b95becd458d7594efdcb5db91d474caac2ac" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
