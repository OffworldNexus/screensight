# Workspace root. The Raspberry Pi device daemon lives in `device/`; the Home
# Assistant Python integration lives in `custom_components/screensight/`.
#
# `[patch]` and `[profile]` are honoured only at the workspace root, so the
# vendored `xattr` / `blade-graphics` fixes and the release profile stay here.
[workspace]
resolver = "2"
members = ["device"]

# `xattr` 0.2.3 (via gpui_http_client -> zed-async-tar) references
# `libc::ENOATTR`, absent on Linux/aarch64. `blade-graphics` requests an
# unsupported X11 composite-alpha flag on V3DV and prefers MAILBOX present mode.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
blade-graphics = { path = "vendor/blade-graphics" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
