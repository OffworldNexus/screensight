<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=800"><title>Screensight / signal cast touch demo</title><style>
@font-face{font-family:VT323;src:url("fonts/VT323-Regular.ttf")}@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono[wght].ttf")}@font-face{font-family:Silkscreen;src:url("fonts/Silkscreen-Regular.ttf")}
*{box-sizing:border-box}body{margin:0;background:#141110;color:#faf7f2;font-family:"JetBrains Mono"}main{position:relative;width:800px;height:480px;overflow:hidden;padding:28px}.tag{font:12px Silkscreen;color:#0bb2b3}h1{font:52px VT323;margin:20px 0 12px}.caption{font-size:13px;color:#c0b4a4;line-height:1.6}.deck{margin-top:32px;padding:20px;background:#211c18;position:relative}.readout{font:44px VT323;color:#f2a900;margin-bottom:18px}.controls{display:flex;align-items:center;gap:14px}.key{position:relative;width:112px;height:62px;padding:0;border:0;background:#0b0908;color:#faf7f2;font:16px "JetBrains Mono";clip-path:polygon(3px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px);cursor:pointer}.key span{display:flex;justify-content:center;align-items:center;position:absolute;inset:0 0 4px;background:#3a322c;border-top:1px solid #6b6158;transition:transform 65ms ease-out}.key.gold{background:#a86b00;color:#141110}.key.gold span{background:#f2a900;border-color:#ffcf79}.key:active span{transform:translateY(3px)}.rail{position:relative;height:64px;flex:1;background:#0b0908;border:2px solid #514943;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);touch-action:none;cursor:ew-resize}.segments{position:absolute;inset:12px 14px;display:flex;gap:5px}.segment{flex:1;background:#3a322c;transform:skewY(-10deg);border-radius:1px}.segment.on{background:#f2a900}.cursor{position:absolute;top:3px;width:22px;height:54px;background:#faf7f2;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);pointer-events:none}.cursor:after{content:"";position:absolute;left:10px;top:10px;width:3px;height:32px;background:#141110}.status{font-size:11px;color:#c0b4a4;min-height:18px;margin-top:12px}.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}.wave{position:absolute;width:76px;height:76px;margin:-38px;opacity:0;transform:scale(.25)}.wave path{fill:none;stroke:#f2a900;stroke-width:1.5}.shard{position:absolute;width:10px;height:4px;background:#0bb2b3;clip-path:polygon(0 0,70% 0,100% 100%,30% 100%)}.settings{display:flex;justify-content:space-between;font-size:12px;margin-top:18px}.settings label{cursor:pointer}.reduce .key span{transition:none}:focus-visible{outline:2px solid #faf7f2;outline-offset:-3px}
</style></head><body><main id="stage"><div class="tag">SCREENSIGHT / TOUCH EXPRESSION</div><h1>Signal cast. Not a magic circle.</h1><div class="caption">Try the keycaps and drag the light rail.<br>Angular wavefronts, cut-paper shards, a mechanical contact lock.</div><section class="deck"><div class="readout" id="value">64%</div><div class="controls"><button class="key" id="off"><span>0%</span></button><div class="rail" id="rail" role="slider" tabindex="0" aria-label="Room light brightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64"><div class="segments" id="segments"></div><div class="cursor" id="cursor"></div></div><button class="key gold" id="full"><span>100%</span></button></div><div class="status" id="status">DEMO / LOCAL VALUE ONLY</div></section><div class="settings"><label><input type="checkbox" id="reduce"> Reduced motion</label><span>Gold: light / teal: signal · settles within 320 ms</span></div><div class="fx" id="fx"></div></main><script>
const rail=document.getElementById('rail'),cursor=document.getElementById('cursor'),segments=document.getElementById('segments'),stage=document.getElementById('stage');let value=64,drag=false;const reduced=document.getElementById('reduce');reduced.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;reduced.onchange=()=>stage.classList.toggle('reduce',reduced.checked);reduced.onchange();
for(let i=0;i<24;i++){const s=document.createElement('div');s.className='segment';segments.appendChild(s);}function set(v){value=Math.round(Math.max(0,Math.min(100,v)));document.getElementById('value').textContent=value+'%';rail.setAttribute('aria-valuenow',value);[...segments.children].forEach((s,i)=>s.classList.toggle('on',i<Math.ceil(value/100*24)));cursor.style.left=(12+(rail.clientWidth-48)*value/100)+'px';}set(value);
function cast(x,y){const box=stage.getBoundingClientRect();x-=box.left;y-=box.top;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('wave');svg.setAttribute('viewBox','0 0 76 76');svg.innerHTML='<path d="M2 2 H59 L74 17 V74 H2 Z"/><path d="M19 25 V19 H25 M51 19 H57 V25 M57 51 V57 H51 M25 57 H19 V51" stroke="#faf7f2"/>';svg.style.left=x+'px';svg.style.top=y+'px';document.getElementById('fx').appendChild(svg);if(reduced.checked){svg.style.opacity='1';svg.style.transform='scale(.65)';setTimeout(()=>svg.remove(),140);return;}svg.animate([{opacity:.9,transform:'scale(.3)'},{opacity:.7,transform:'scale(.8)',offset:.35},{opacity:0,transform:'scale(1.6)'}],{duration:320,easing:'cubic-bezier(.15,.6,.3,1)'}).onfinish=()=>svg.remove();for(let i=0;i<4;i++){const p=document.createElement('div');p.className='shard';p.style.left=x+'px';p.style.top=y+'px';const dx=i===0||i===3?-1:1,dy=i<2?-1:1;document.getElementById('fx').appendChild(p);p.animate([{opacity:1,transform:'translate(0,0)'},{opacity:0,transform:'translate('+dx*58+'px,'+dy*42+'px)'}],{duration:260,easing:'ease-out'}).onfinish=()=>p.remove();}}
function position(e){const b=rail.getBoundingClientRect();set((e.clientX-b.left-12)/(b.width-48)*100);}rail.onpointerdown=e=>{drag=true;rail.setPointerCapture(e.pointerId);position(e);document.getElementById('status').textContent='TARGET / '+value+'%';};rail.onpointermove=e=>{if(drag){position(e);document.getElementById('status').textContent='TARGET / '+value+'%';}};rail.onpointerup=e=>{if(!drag)return;drag=false;cast(e.clientX,e.clientY);document.getElementById('status').textContent='DEMO VALUE SET / '+value+'%';};rail.onpointercancel=()=>drag=false;rail.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();set(e.key==='Home'?0:e.key==='End'?100:value+(e.key==='ArrowRight'?1:-1));}};
for(const [id,v]of [['off',0],['full',100]])document.getElementById(id).onclick=e=>{set(v);const b=e.currentTarget.getBoundingClientRect();cast(e.detail?e.clientX:b.left+b.width/2,e.detail?e.clientY:b.top+b.height/2);document.getElementById('status').textContent='DEMO VALUE SET / '+v+'%';};
</script></body></html>
