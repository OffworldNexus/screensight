function draw(nodes,parent){for(const n of nodes){const e=document.createElement('div');e.className='node '+(n.type==='panel'?'panel':'');e.dataset.name=n.name;e.style.left=n.x+'px';e.style.top=n.y+'px';if(n.w)e.style.width=n.w+'px';if(n.h)e.style.height=n.h+'px';if(n.type==='text'){e.textContent=n.text;e.style.color=n.fill;e.style.fontFamily=n.font;e.style.fontSize=n.size+'px';e.style.fontWeight=n.weight;}else{e.style.background=n.fill;e.style.borderRadius=n.r+'px';if(n.stroke)e.style.border='1px solid '+n.stroke;}parent.appendChild(e);if(n.children)draw(n.children,e);}}
draw(scene,document.getElementById('screen'));
function node(name){return [...document.querySelectorAll('[data-name]')].find(e=>e.dataset.name===name)}
const range=document.getElementById('brightness');
function light(value){range.value=value;node('Brightness value').textContent=value+'%';node('Light / slider fill').style.width=(216*value/100)+'px';node('Light / slider thumb').style.left=(72+216*value/100)+'px';}
range.addEventListener('input',()=>light(Number(range.value)));
document.getElementById('off').onclick=()=>light(0);document.getElementById('on').onclick=()=>light(100);
const titles=['Re-humidify humidor','Replace sensor battery'];let selected=0;
function openSnooze(index){selected=index;document.getElementById('snooze-title').textContent=titles[index];document.getElementById('snooze-note').textContent='Routine maintenance. Until next occurrence means: hide this occurrence until it clears, then remind on a new occurrence.';document.getElementById('snooze').classList.add('open');document.getElementById('evening').focus();}
document.querySelectorAll('[data-snooze]').forEach(b=>b.onclick=()=>openSnooze(Number(b.dataset.snooze)));
function close(){document.querySelectorAll('.overlay').forEach(e=>e.classList.remove('open'));}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function notify(message){close();const t=document.getElementById('notice');t.textContent=message;t.style.display='block';setTimeout(()=>t.style.display='none',3500);}
document.getElementById('evening').onclick=()=>notify(titles[selected]+' · snoozed until 18:00');
document.getElementById('recurrence').onclick=()=>notify(titles[selected]+' · snoozed for this occurrence');
document.getElementById('queue-open').onclick=()=>document.getElementById('queue').classList.add('open');
if(location.hash==='#snooze')openSnooze(0);
if(location.hash==='#queue')document.getElementById('queue').classList.add('open');
</script></body></html>
