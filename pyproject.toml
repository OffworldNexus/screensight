[project]
name = "screensight"
version = "0.1.0"
description = "Home Assistant custom integration for the Screensight Raspberry Pi display"
license = { text = "MIT" }
authors = [
    { name = "Rémy Sanchez", email = "remy.sanchez@hyperthese.net" },
]
requires-python = ">=3.12"
dependencies = [
    "homeassistant",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "pytest-bdd",
    "allure-pytest-bdd",
    "pytest-playwright",
    "syrupy",
]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
# Home Assistant custom components live outside the `homeassistant` package and
# are loaded dynamically; HA ships no type stubs for third-party integrations.
# A good chunk of the HA API is annotated, but several helpers are not, so we
# keep the checks pragmatic: catch real errors without demanding stubs.
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["voluptuous.*", "zeroconf.*", "syrupy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# Quiet on pass, verbose on fail: short tracebacks + summary of non-passes, and
# Allure results always written (report rendering is a separate step).
addopts = [
    "-q",
    "-ra",
    "--tb=short",
    "--alluredir=allure-results",
    "--clean-alluredir",
]
markers = [
    "bdd: pytest-bdd scenarios (pairing + display text)",
    "e2e: end-to-end tests that need a real socket / browser",
]
filterwarnings = [
    # The mocked zeroconf dependency is torn down while HA cancels its setup
    # task; the resulting unawaited AsyncMock coroutine is a harness artifact,
    # not integration behaviour.
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]

[tool.ruff]
target-version = "py312"
# The Rust build tree and generated HA throwaway dev config are not Python we
# own.
exclude = [
    ".venv",
    "target",
    # Pre-existing, standalone uv-run maintainer scripts owned by the Rust/GPU
    # side of the repo; not part of the integration package.
    "tools",
    "custom_components/screensight/dev/config",
]

[tool.ruff.lint.per-file-ignores]
# Tests: fixtures shadow args, asserts are the point, and long expected-value
# literals/docstrings are clearer unwrapped. Test modules are not a package.
"tests/**/*.py" = ["ARG001", "S101", "E501", "S105", "S106", "INP001", "PT011"]
# Step definitions read as prose; the scenario name already documents them.
"tests/features/**/*.py" = ["ARG001", "S101", "E501", "S105", "S106", "INP001", "D103"]
# Standalone, uv-run maintenance/generation scripts: CLI prints, long strings
# and a top-level loop are expected.
"custom_components/screensight/scripts/*.py" = ["T201", "BLE001", "E501", "D103", "C901", "INP001"]
# Standalone, uv-run developer CLIs at the repo root (device smoke tests,
# fake-HA driver, dev-HA provisioner): prints, CLI help strings, placeholder
# credentials for the throwaway dev instance and urllib URL opens are expected.
"scripts/*.py" = ["T201", "BLE001", "E501", "D103", "C901", "INP001", "S105", "S106", "S310"]
"tools/*.py" = ["T201", "BLE001", "E501", "D103", "C901", "INP001", "S105", "S106", "S310"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint]
select = [
    # -- Core --
    "E",  # pycodestyle (errors)
    "W",  # pycodestyle (warnings)
    "F",  # Pyflakes
    "I",  # isort
    "C90",  # McCabe Complexity
    "D1",  # Mandatory docstrings
    "S",  # Bandit

    # -- Bonus --
    "A",  # flake8-bugbear
    "B",  # flake8-bugbear
    "DTZ",  # date/time zone
    "T10",  # debugger
    "EM",  # error messages
    "EXE",  # executable
    "G",  # logging
    "UP",  # pyupgrade
    "ASYNC",  # async
    "INP",  # PEP 420
    "T20",  # no print
    "PT",  # pytest
    "SLOT",  # slots
    "TCH",  # type checking blocks
    "PTH",  # Use pathlib
    "FIX",  # Don't allow not done stuff in code
    "ERA",  # Don't comment code
    "RUF",  # Ruff stuff
    "TID251",  # Banned imports (See below)
]

# Idioms we deliberately allow:
#   RUF012 -- HA entity/const class attributes are the canonical style and
#             ClassVar noise is not worth it.
#   D104   -- package __init__.py files don't need docstrings.
#   D105   -- magic methods are self-describing.
#   D106   -- nested config classes are pure configuration.
ignore = ["RUF012", "D104", "D105", "D106"]

[tool.ruff.format]
exclude = [
    ".venv",
    "target",
    "tools",
    "custom_components/screensight/dev/config",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use `httpx` instead, which has timeouts by default."

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/screensight"]
